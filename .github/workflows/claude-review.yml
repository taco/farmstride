name: Claude Review

# Automatic, advisory review when a PR is opened or marked ready. Not re-run on
# push; ask `@claude` on the PR for a re-review (see claude.yml).
on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skipped rather than failed: drafts, fork PRs (no secrets), and PRs whose
    # author is a bot or lacks write access (the action rejects both).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/repo-writers
        id: writers

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The sticky comment only exists in the action's tracking-comment mode,
          # which track_progress turns on for pull_request events. It is the
          # review summary, updated in place when the review reruns.
          track_progress: true
          use_sticky_comment: true
          include_comments_by_actor: ${{ steps.writers.outputs.logins }}
          prompt: |
            Review this pull request. Read docs/agents/review.md first: it is the
            brief for what the review is for, what to skip, and how to report.

            This run is review-only: do not edit, commit, or push.

            Put line-specific findings on their lines with
            mcp__github_inline_comment__create_inline_comment, skipping any that
            an earlier review already left on the PR. Your tracking comment is
            the review summary, so finish it with your verdict.
          # Tracking-comment mode grants edit, commit and push tools by default;
          # the deny list takes them back so the review stays read-only.
          claude_args: |
            --model sonnet
            --effort medium
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git add:*),Bash(git commit:*),Bash(git rm:*)"
