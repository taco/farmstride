name: Claude Code Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          # The security list below is a condensed twin of the auth/tenancy checklist
          # in docs/review-checklist.md — keep the two in sync.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are triggered by a comment on a PR. Do exactly what the comment asks — nothing more.

            CLAUDE.md has the project conventions — use them.

            If asked to review the PR, follow these review guidelines:

            Focus on (in priority order):
            1. Bugs and logic errors
            2. Security:
               - Auth is secure-by-default (secureByDefaultTransformer): flag new @public fields that shouldn't be public, and flag inline `if (!context.rider)` checks (use shared helpers: getBarnId, requireTrainer, requireOwnerOrTrainer)
               - Barn scoping: queries/mutations must filter by barnId from context — missing it is a cross-tenant data leak
               - Rider queries use `omit: { password: true }` — a missing omit exposes password hashes to the client
               - Secrets or credentials in committed code
               - Raw SQL ($queryRaw/$executeRaw) without parameterization
               - Unbounded GraphQL inputs (missing pagination limits, deep nesting)
               - Dev-only surfaces (/api/dev/, introspection) must fail closed in production
            3. Suspicious dependency additions in package.json
            4. N+1 queries in nested GraphQL resolvers
            5. schema.prisma ↔ schema.graphql out of sync

            Skip:
            - Formatting, style, and type hygiene (CI and linters handle that)
            - Trivial nitpicks
            - Suggestions that add complexity without clear value

            Be direct. Only comment when something should change.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

            End with a single verdict:
            - ✅ if no issues found
            - ⚠️ with short bullet points if there are issues that should be fixed before merging
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue create:*),Bash(gh api:repos/*/pulls/*/comments*),Bash(gh api:repos/*/issues/*/comments*)"
